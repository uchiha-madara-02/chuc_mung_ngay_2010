<style>
:root{
  --plum:#2a0f2e; --plum2:#4a1a4f; --rose:#e8567f; --blush:#ffd9e2; --gold:#f4c26b; --ivory:#fff6f1;

}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; color:var(--ivory);
  font-family:"Be Vietnam Pro",system-ui,sans-serif; font-weight:300; line-height:1.6;
  background:radial-gradient(1200px 700px at 50% -10%,var(--plum2),var(--plum) 70%) fixed var(--plum);
  overflow-x:hidden;
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:40px 20px 56px;text-align:center}
.date{display:inline-block;padding:6px 18px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font-size:.9rem;letter-spacing:.04em}
h1{font-family:"Dancing Script",cursive;font-weight:700;font-size:clamp(2.6rem,10vw,5rem);line-height:1.1;margin:18px 0 6px;
  background:linear-gradient(90deg,var(--blush),var(--gold),var(--blush));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;color:var(--blush);font-size:1.05rem}
.count{margin-top:10px;font-size:.9rem;color:var(--gold);min-height:1.4em}
#bouquet{width:min(100%,480px);height:auto;margin:10px auto -6px;display:block;cursor:pointer;overflow:visible}
.head{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:bloom 1.4s cubic-bezier(.2,1.3,.4,1) forwards}
.sway{animation:sway 5s ease-in-out infinite alternate}
.nod{transform-box:fill-box;transform-origin:center;animation:nod 3.4s ease-in-out infinite alternate}
@keyframes nod{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes bloom{to{transform:scale(1)}}
@keyframes sway{from{transform:rotate(-3.2deg)}to{transform:rotate(3.2deg)}}
.card{background:rgba(255,246,241,.07);border:1px solid rgba(255,217,226,.28);border-radius:22px;padding:26px 24px 22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.to{font-family:"Dancing Script",cursive;font-size:1.9rem;color:var(--gold);margin:0 0 6px}
#wish{font-size:1.12rem;min-height:5.6em;margin:0 auto;max-width:34em;transition:opacity .35s}
#wish.out{opacity:0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
input{font:inherit;color:var(--ivory);background:rgba(0,0,0,.25);border:1px solid rgba(255,217,226,.4);border-radius:99px;padding:11px 18px;min-width:0;flex:1 1 180px;max-width:260px;text-align:center}
input::placeholder{color:rgba(255,217,226,.6)}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:99px;padding:11px 22px;color:var(--plum);background:linear-gradient(135deg,var(--gold),var(--blush));transition:transform .15s}
button.ghost{background:transparent;color:var(--blush);border:1px solid var(--blush)}
button:hover{transform:translateY(-2px)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.foot{margin-top:26px;font-size:.85rem;color:rgba(255,217,226,.7)}
h1{background-size:200% auto;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#e8567f;left:-20vmax;top:-10vmax}
.aurora i:nth-child(2){background:#7a3cff;right:-25vmax;top:20vh;animation-delay:-6s}
.aurora i:nth-child(3){background:#f4c26b;left:10vw;bottom:-35vmax;opacity:.22;animation-delay:-11s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.2)}}
.mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:5;padding:8px 16px;font-size:.85rem;background:rgba(42,15,46,.65);color:var(--blush);border:1px solid var(--blush);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.chip{padding:7px 15px;font-size:.88rem;font-weight:400;background:transparent;color:var(--blush);border:1px solid rgba(255,217,226,.45)}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--blush));color:var(--plum);border-color:transparent;font-weight:600}
.card{box-shadow:0 20px 60px rgba(232,86,127,.25),inset 0 0 0 1px rgba(244,194,107,.12)}
#wish::after{content:'';display:inline-block;width:2px;height:1.1em;background:var(--gold);margin-left:3px;vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.aurora i,h1,#wish::after{animation:none}.sway,.nod,.eq b,.splash .env,.open{animation:none!important}.head{animation-duration:.01s}#wish{transition:none}}
/* Tăng độ tương phản để lời chúc dễ đọc hơn */
body{color:#fffafc;font-weight:400;background:radial-gradient(1000px 600px at 50% -15%,#3a173f,#190b20 72%) fixed #190b20}
.aurora i{opacity:.16;filter:blur(110px)}
.aurora i:nth-child(3){opacity:.08}

#wish{color:#fffafc;font-weight:400;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.sub{color:#ffe8ef;font-weight:400}
.foot{color:#e9cbd6}
.chip{color:#ffe8ef;border-color:rgba(255,232,239,.68);font-weight:500}
button.ghost{color:#ffe8ef;border-color:#ffe8ef}

.to{color:#ffd77e;text-shadow:0 1px 2px rgba(0,0,0,.35)}
/* ===== Giao diện mới ===== */
body{overflow-x:hidden}
main{max-width:720px;padding:34px 18px 60px}
.date{background:rgba(244,194,107,.1);letter-spacing:.14em;font-weight:600;font-size:.82rem;padding:7px 20px}
h1{font-size:clamp(2.5rem,9.5vw,4.6rem);margin:20px 0 10px;filter:drop-shadow(0 4px 24px rgba(232,86,127,.35))}
.sub{max-width:28em;margin:0 auto;font-size:1.02rem}
.count{display:inline-block;margin-top:14px;padding:5px 16px;border-radius:99px;background:rgba(0,0,0,.28);font-weight:600}
.count:empty{display:none}
#bouquet{width:min(100%,500px);margin:14px auto -10px;filter:drop-shadow(0 18px 38px rgba(232,86,127,.3))}
.card{position:relative;max-width:640px;margin:26px auto 0;padding:40px 22px 24px;border-radius:28px}
.card::before{content:"\201C";position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-family:"Dancing Script",cursive;font-size:92px;line-height:1;color:var(--gold);text-shadow:0 2px 16px rgba(244,194,107,.5)}
.chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;justify-content:safe center;scroll-snap-type:x proximity;padding:4px 2px 10px;margin:0 -4px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:center;white-space:nowrap;padding:8px 16px;transition:background .25s,color .25s,transform .15s}
.chip.on{box-shadow:0 4px 16px rgba(244,194,107,.35)}
.to{font-size:2.1rem;margin-bottom:8px}
#wish{font-size:1.18rem;line-height:1.75;min-height:7.4em;display:flex;align-items:center;justify-content:center;text-wrap:pretty}
.row{gap:10px;margin-top:20px}
.row input{flex:1 1 100%;max-width:none;padding:13px 20px;background:rgba(255,255,255,.07)}
.row input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,194,107,.25)}
.row button{flex:1 1 150px;padding:13px 20px}
.foot{margin-top:22px}
.mus{display:flex;align-items:center;gap:9px;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;padding:9px 16px;font-weight:600}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
.eq b{display:block;width:3px;height:4px;border-radius:2px;background:var(--gold)}
.mus.playing .eq b{animation:eq .9s ease-in-out infinite alternate}
.eq b:nth-child(2){animation-delay:-.3s!important}.eq b:nth-child(3){animation-delay:-.6s!important}
@keyframes eq{to{height:13px}}
body.opened main>*:not(h1){animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
body.opened main>*:nth-child(2){animation-delay:.12s}body.opened main>*:nth-child(4){animation-delay:.2s}
body.opened main>*:nth-child(5){animation-delay:.3s}body.opened main>*:nth-child(6){animation-delay:.45s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;cursor:pointer;
  background:radial-gradient(900px 600px at 50% 30%,#4a1a4f,#190b20 75%);transition:opacity .8s,visibility .8s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash .env{font-size:84px;line-height:1;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 12px 28px rgba(232,86,127,.5))}
@keyframes float{50%{transform:translateY(-12px) rotate(-3deg)}}
.sp-to{font-family:"Dancing Script",cursive;font-size:clamp(1.9rem,7vw,2.8rem);color:var(--gold);margin:0;max-width:16em}
.open{padding:15px 34px;font-size:1.05rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(244,194,107,.18)}}
.splash small{color:#e9cbd6}
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100dvh;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{font-size:16px;-webkit-user-select:text;user-select:text}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation}
@media (max-width:600px){
  main{padding:62px 14px 36px}
  .date{font-size:.74rem;padding:6px 16px}

  .sub{font-size:.95rem;padding:0 6px}
  .count{font-size:.82rem;margin-top:10px}
  #bouquet{width:100%;margin:4px auto -6px}

  .chips{margin:0 -6px 10px;padding:4px 6px 8px}
  .chip{min-height:40px;padding:8px 14px;font-size:.86rem}

  #wish{font-size:1.05rem;line-height:1.7;min-height:9.4em}

  .splash{padding:20px}.splash .env{font-size:72px}.open{padding:16px 30px;min-height:50px}
}
@media (max-height:520px) and (orientation:landscape){main{padding-top:56px}#bouquet{width:min(60vh,320px)}.splash .env{font-size:52px}}
</style>

  }
  mbtn.onclick=function(){touched=true;playing?stopM():startM()};
  document.addEventListener("click",function(){if(!touched){touched=true;if(!playing)startM()}});
  /* mở thiệp: lần chạm đầu tiên cũng là lúc tự bật nhạc (trình duyệt không cho phát nhạc khi chưa có thao tác) */
  var sp=document.getElementById("splash");
  function openCard(){
    if(!sp||sp.classList.contains("hide"))return;
    touched=true;sp.classList.add("hide");document.body.classList.add("opened");
    if(!playing)startM();
    build();burst(innerWidth/2,innerHeight*.4,44);
    setTimeout(function(){if(sp&&sp.parentNode)sp.parentNode.removeChild(sp)},900);
  }
  sp.addEventListener("click",openCard);
  addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){if(sp&&!sp.classList.contains("hide")){e.preventDefault();openCard()}}});
  setTimeout(function(){try{document.getElementById("open").focus({preventScroll:true})}catch(e){}},50);

  /* chặn thu phóng (pinch, double-tap, Ctrl+cuộn, Ctrl +/-) */
  ["gesturestart","gesturechange","gestureend"].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},{passive:false})});
  document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
  addEventListener("wheel",function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
  addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&(e.key==="+"||e.key==="-"||e.key==="="||e.key==="0"))e.preventDefault()});

  /* init */
  var m=location.hash.match(/ten=([^&]+)/);
  if(m){try{nameIn.value=decodeURIComponent(m[1]).slice(0,30)}catch(e){}}
  idx=Math.floor(Math.random()*cur().length);
  size();addEventListener("resize",size);build();render(false);count();loop();setBtn();
  if(nameIn.value.trim())document.getElementById("spTo").textContent="Gửi "+nameIn.value.trim()+", có một lời chúc dành riêng cho bạn";
  setTimeout(function(){burst(innerWidth/2,innerHeight*.35,26)},900);
})();
</script>
</body>
</html>
